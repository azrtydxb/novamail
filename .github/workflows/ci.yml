name: CI

# Runs only on merges to main: builds and publishes images. PR validation
# (go test/vet, lint, helm lint, node build) lives in pr-checks.yml, so nothing
# is duplicated between the two workflows.
#
# There is no deploy step. The novamail namespace was removed from the kw
# cluster, taking its RBAC with it; the job is in git history if it returns.
on:
  push:
    branches: [main]
    # Docs / bootstrap-only changes don't need an image rebuild.
    paths-ignore: ["docs/**", "*.md", "**/*.md", "deploy/cluster/**", ".github/workflows/pages.yml"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Cluster Zot registry (cluster-CA trusted by node containerd).
  REGISTRY: 192.168.10.131:5000
  IMAGE_BASE: 192.168.10.131:5000/azrtydxb/novamail

jobs:
  build-image:
    runs-on: arc-azrtydxb-publish
    strategy:
      matrix:
        service: [ingress, delivery, dsn, maintenance]
    steps:
      - uses: actions/checkout@v4
      - name: Compute image tag
        id: meta
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Set up buildx (zot insecure)
        run: |
          cat > /tmp/buildkitd.toml <<'EOF'
          [registry."192.168.10.131:5000"]
            insecure = true
          # Pull base images (node/golang/nginx) through the cluster Zot registry's
          # Docker Hub pull-through cache — never hit docker.io anonymously (429s).
          # :443, not :5000. Only the read-only group on :443 fronts the
          # docker.io proxy; :5000 is the hosted repository and 404s on
          # anything it was not pushed. It needs its own insecure entry too,
          # or the mirror fails TLS and BuildKit silently falls back to
          # Docker Hub — no error, and no benefit.
          [registry."192.168.10.131"]
            insecure = true
          [registry."docker.io"]
            mirrors = ["192.168.10.131"]
          EOF
          docker buildx create --name nm --driver docker-container \
            --platform linux/arm64,linux/amd64 --buildkitd-config /tmp/buildkitd.toml --use
          docker buildx inspect --bootstrap
      # Nexus requires credentials to push. The Zot registry this replaced
      # accepted anonymous writes, so no login was ever needed here — the
      # push now fails with "unauthorized: access to the requested resource
      # is not authorized" without it. Pulls stay anonymous.
      - name: Log in to Nexus
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.NEXUS_USER }}
          password: ${{ secrets.NEXUS_PASSWORD }}
      - name: Build & push ${{ matrix.service }} (multi-arch → zot)
        uses: docker/build-push-action@v7
        with:
          context: .
          builder: nm
          # Multi-arch (arm64 for kw + amd64 for portability). Go cross-compiles (no QEMU).
          platforms: linux/arm64,linux/amd64
          build-args: SERVICE=${{ matrix.service }}
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/${{ matrix.service }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_BASE }}/${{ matrix.service }}:main
          cache-from: type=registry,ref=${{ env.REGISTRY }}/buildcache/novamail-${{ matrix.service }}:arm64
          cache-to: type=registry,ref=${{ env.REGISTRY }}/buildcache/novamail-${{ matrix.service }}:arm64,mode=max,image-manifest=true

  build-admin-api:
    runs-on: arc-azrtydxb-publish
    steps:
      - uses: actions/checkout@v4
      - name: Compute image tag
        id: meta
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Set up buildx (zot insecure)
        run: |
          cat > /tmp/buildkitd.toml <<'EOF'
          [registry."192.168.10.131:5000"]
            insecure = true
          # Pull base images (node/golang/nginx) through the cluster Zot registry's
          # Docker Hub pull-through cache — never hit docker.io anonymously (429s).
          # :443, not :5000. Only the read-only group on :443 fronts the
          # docker.io proxy; :5000 is the hosted repository and 404s on
          # anything it was not pushed. It needs its own insecure entry too,
          # or the mirror fails TLS and BuildKit silently falls back to
          # Docker Hub — no error, and no benefit.
          [registry."192.168.10.131"]
            insecure = true
          [registry."docker.io"]
            mirrors = ["192.168.10.131"]
          EOF
          docker buildx create --name nm --driver docker-container \
            --platform linux/arm64,linux/amd64 --buildkitd-config /tmp/buildkitd.toml --use
          docker buildx inspect --bootstrap
      # Nexus requires credentials to push. The Zot registry this replaced
      # accepted anonymous writes, so no login was ever needed here — the
      # push now fails with "unauthorized: access to the requested resource
      # is not authorized" without it. Pulls stay anonymous.
      - name: Log in to Nexus
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.NEXUS_USER }}
          password: ${{ secrets.NEXUS_PASSWORD }}
      - name: Build & push admin-api (multi-arch → zot)
        uses: docker/build-push-action@v7
        with:
          context: services/admin-api
          builder: nm
          platforms: linux/arm64,linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/admin-api:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_BASE }}/admin-api:main
          cache-from: type=registry,ref=${{ env.REGISTRY }}/buildcache/novamail-admin-api:arm64
          cache-to: type=registry,ref=${{ env.REGISTRY }}/buildcache/novamail-admin-api:arm64,mode=max,image-manifest=true

  build-web:
    runs-on: arc-azrtydxb-publish
    steps:
      - uses: actions/checkout@v4
      - name: Compute image tag
        id: meta
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Set up buildx (zot insecure)
        run: |
          cat > /tmp/buildkitd.toml <<'EOF'
          [registry."192.168.10.131:5000"]
            insecure = true
          # Pull base images (node/golang/nginx) through the cluster Zot registry's
          # Docker Hub pull-through cache — never hit docker.io anonymously (429s).
          # :443, not :5000. Only the read-only group on :443 fronts the
          # docker.io proxy; :5000 is the hosted repository and 404s on
          # anything it was not pushed. It needs its own insecure entry too,
          # or the mirror fails TLS and BuildKit silently falls back to
          # Docker Hub — no error, and no benefit.
          [registry."192.168.10.131"]
            insecure = true
          [registry."docker.io"]
            mirrors = ["192.168.10.131"]
          EOF
          docker buildx create --name nm --driver docker-container \
            --platform linux/arm64,linux/amd64 --buildkitd-config /tmp/buildkitd.toml --use
          docker buildx inspect --bootstrap
      # Nexus requires credentials to push. The Zot registry this replaced
      # accepted anonymous writes, so no login was ever needed here — the
      # push now fails with "unauthorized: access to the requested resource
      # is not authorized" without it. Pulls stay anonymous.
      - name: Log in to Nexus
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.NEXUS_USER }}
          password: ${{ secrets.NEXUS_PASSWORD }}
      - name: Build & push web (multi-arch → zot)
        uses: docker/build-push-action@v7
        with:
          context: web
          builder: nm
          platforms: linux/arm64,linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/web:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_BASE }}/web:main
          cache-from: type=registry,ref=${{ env.REGISTRY }}/buildcache/novamail-web:arm64
          cache-to: type=registry,ref=${{ env.REGISTRY }}/buildcache/novamail-web:arm64,mode=max,image-manifest=true
