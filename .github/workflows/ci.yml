name: CI

# Runs only on merges to main: builds and publishes images. PR validation
# (go test/vet, lint, helm lint, node build) lives in pr-checks.yml, so nothing
# is duplicated between the two workflows.
#
# There is no deploy step. The novamail namespace was removed from the kw
# cluster, taking its RBAC with it; the job is in git history if it returns.
on:
  push:
    branches: [main]
    # Docs / bootstrap-only changes don't need an image rebuild.
    paths-ignore: ["docs/**", "*.md", "**/*.md", "deploy/cluster/**", ".github/workflows/pages.yml"]

permissions:
  contents: read
  # GitHub OIDC for the Kuvryn Ant docker login (azrtydxb/ant-setup-action).
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Authoritative Kuvryn Ant (OKE), GitHub OIDC login; kw replicates oci-hosted.
  REGISTRY: ant.azrty.com/oci-hosted
  IMAGE_BASE: ant.azrty.com/oci-hosted/azrtydxb/novamail

jobs:
  # One build per image and architecture, each on a runner of its own architecture
  # (arc-azrtydxb = arm64, arc-azrtydxb-amd64 = amd64) with the runner pod's BuildKit
  # sidecar, and each with its own Ant cache ref (<branch>-<image>-<arch>): two
  # platforms writing one cache ref overwrite each other. The image is pushed by
  # digest; the manifest job below joins the two digests under the usual tag.
  build:
    runs-on: ${{ matrix.arch == 'amd64' && 'arc-azrtydxb-amd64' || 'arc-azrtydxb' }}
    strategy:
      matrix:
        # The Go data-plane services share the root Dockerfile (SERVICE build-arg);
        # admin-api and web have their own context.
        image: [ingress, delivery, dsn, maintenance, admin-api, web]
        arch: [arm64, amd64]
        include:
          - image: admin-api
            context: services/admin-api
          - image: web
            context: web
    steps:
      - uses: actions/checkout@v4
      - name: Set up buildx (runner pod's BuildKit sidecar)
        id: builder
        uses: azrtydxb/.github/actions/setup-builder@d021f2ca9fa3d6682085a7d069b7c8b1dc7b9b80 # main
      - name: Log in to Kuvryn Ant (GitHub OIDC)
        id: ant
        uses: azrtydxb/ant-setup-action@549f7472cf26b0885441ed9f9a7fab0277545000 # v1
        with:
          build-cache: "true"
          cache-name: ${{ matrix.image }}
          arch-suffix: ${{ matrix.arch }}
          docker-login: "true"
          required: "true"
          go: "false"
          cargo: "false"
          pip: "false"
      - name: Build & push ${{ matrix.image }} linux/${{ matrix.arch }} (by digest)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context || '.' }}
          builder: ${{ steps.builder.outputs.name }}
          platforms: linux/${{ matrix.arch }}
          build-args: ${{ !matrix.context && format('SERVICE={0}', matrix.image) || '' }}
          outputs: type=image,name=${{ env.IMAGE_BASE }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: ${{ steps.ant.outputs.cache-from }}
          cache-to: ${{ steps.ant.outputs.cache-to }}
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Joins the arm64 and amd64 digests into the multi-arch sha-<short> tag.
  manifest:
    needs: [build]
    runs-on: arc-azrtydxb
    strategy:
      matrix:
        image: [ingress, delivery, dsn, maintenance, admin-api, web]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true
      - name: Log in to Kuvryn Ant (GitHub OIDC)
        uses: azrtydxb/ant-setup-action@549f7472cf26b0885441ed9f9a7fab0277545000 # v1
        with:
          docker-login: "true"
          required: "true"
          go: "false"
          cargo: "false"
          pip: "false"
      - name: Create & push ${{ matrix.image }} manifest list
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ env.IMAGE_BASE }}/${{ matrix.image }}
        run: |
          tag="sha-${GITHUB_SHA::7}"
          refs=()
          for d in *; do refs+=("$IMAGE@sha256:$d"); done
          docker buildx imagetools create -t "$IMAGE:$tag" "${refs[@]}"
          docker buildx imagetools inspect "$IMAGE:$tag"
