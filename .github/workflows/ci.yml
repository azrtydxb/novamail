name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Cluster Zot registry (cluster-CA trusted by node containerd).
  REGISTRY: 192.168.10.123:5000
  IMAGE: 192.168.10.123:5000/azrtydxb/novamail/ingress

jobs:
  test:
    runs-on: arc-azrtydxb
    container:
      image: golang:1.23
    steps:
      - uses: actions/checkout@v4
      - name: go vet
        run: go vet ./...
      - name: go test (race)
        run: go test -race ./...

  lint:
    runs-on: arc-azrtydxb
    container:
      image: golangci/golangci-lint:v2.10.1
    steps:
      - uses: actions/checkout@v4
      - run: golangci-lint run ./...

  helm-lint:
    runs-on: arc-azrtydxb
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - run: helm lint deploy/helm/novamail

  build-image:
    needs: [test, lint, helm-lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: arc-azrtydxb-publish
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Compute image tag
        id: meta
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Set up buildx (zot insecure)
        run: |
          cat > /tmp/buildkitd.toml <<'EOF'
          [registry."192.168.10.123:5000"]
            insecure = true
          EOF
          docker buildx create --name nm --driver docker-container \
            --platform linux/arm64 --buildkitd-config /tmp/buildkitd.toml --use
          docker buildx inspect --bootstrap
      - name: Build & push (arm64 → zot)
        uses: docker/build-push-action@v6
        with:
          context: .
          builder: nm
          platforms: linux/arm64
          build-args: SERVICE=ingress
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:main
          cache-from: type=registry,ref=${{ env.REGISTRY }}/buildcache/novamail-ingress:arm64
          cache-to: type=registry,ref=${{ env.REGISTRY }}/buildcache/novamail-ingress:arm64,mode=max,image-manifest=true

  deploy:
    needs: [build-image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # No `container:` — run on the runner pod itself so the in-cluster
    # ServiceAccount token (mounted at the standard path) is available.
    runs-on: arc-azrtydxb
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.31.0
      - name: Build kubeconfig from in-cluster SA token
        run: |
          SA=/var/run/secrets/kubernetes.io/serviceaccount
          kubectl config set-cluster kw \
            --server=https://kubernetes.default.svc \
            --certificate-authority=$SA/ca.crt --embed-certs=true
          kubectl config set-credentials runner --token="$(cat $SA/token)"
          kubectl config set-context kw --cluster=kw --user=runner --namespace=novamail
          kubectl config use-context kw
      - name: Helm upgrade --install
        run: |
          helm upgrade --install novamail deploy/helm/novamail \
            --namespace novamail \
            --set image.tag=${{ needs.build-image.outputs.tag }} \
            --wait --timeout 5m
      - name: Rollout status
        run: kubectl -n novamail rollout status deploy/novamail-ingress --timeout=120s
