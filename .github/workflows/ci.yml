name: CI

# Runs only on merges to main: build images + deploy. PR validation
# (go test/vet, lint, helm lint, node build) lives in pr-checks.yml, so nothing
# is duplicated between the two workflows.
on:
  push:
    branches: [main]
    # Docs / bootstrap-only changes don't need an image rebuild + deploy.
    paths-ignore: ["docs/**", "*.md", "**/*.md", "deploy/cluster/**", ".github/workflows/pages.yml"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Cluster Zot registry (cluster-CA trusted by node containerd).
  REGISTRY: 192.168.10.131:5000
  IMAGE_BASE: 192.168.10.131:5000/azrtydxb/novamail

jobs:
  build-image:
    runs-on: arc-azrtydxb-publish
    strategy:
      matrix:
        service: [ingress, delivery, dsn, maintenance]
    steps:
      - uses: actions/checkout@v4
      - name: Compute image tag
        id: meta
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Set up buildx (zot insecure)
        run: |
          cat > /tmp/buildkitd.toml <<'EOF'
          [registry."192.168.10.131:5000"]
            insecure = true
          # Pull base images (node/golang/nginx) through the cluster Zot registry's
          # Docker Hub pull-through cache — never hit docker.io anonymously (429s).
          # :443, not :5000. Only the read-only group on :443 fronts the
          # docker.io proxy; :5000 is the hosted repository and 404s on
          # anything it was not pushed. It needs its own insecure entry too,
          # or the mirror fails TLS and BuildKit silently falls back to
          # Docker Hub — no error, and no benefit.
          [registry."192.168.10.131"]
            insecure = true
          [registry."docker.io"]
            mirrors = ["192.168.10.131"]
          EOF
          docker buildx create --name nm --driver docker-container \
            --platform linux/arm64,linux/amd64 --buildkitd-config /tmp/buildkitd.toml --use
          docker buildx inspect --bootstrap
      # Nexus requires credentials to push. The Zot registry this replaced
      # accepted anonymous writes, so no login was ever needed here — the
      # push now fails with "unauthorized: access to the requested resource
      # is not authorized" without it. Pulls stay anonymous.
      - name: Log in to Nexus
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.NEXUS_USER }}
          password: ${{ secrets.NEXUS_PASSWORD }}
      - name: Build & push ${{ matrix.service }} (multi-arch → zot)
        uses: docker/build-push-action@v7
        with:
          context: .
          builder: nm
          # Multi-arch (arm64 for kw + amd64 for portability). Go cross-compiles (no QEMU).
          platforms: linux/arm64,linux/amd64
          build-args: SERVICE=${{ matrix.service }}
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/${{ matrix.service }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_BASE }}/${{ matrix.service }}:main
          cache-from: type=registry,ref=${{ env.REGISTRY }}/buildcache/novamail-${{ matrix.service }}:arm64
          cache-to: type=registry,ref=${{ env.REGISTRY }}/buildcache/novamail-${{ matrix.service }}:arm64,mode=max,image-manifest=true

  build-admin-api:
    runs-on: arc-azrtydxb-publish
    steps:
      - uses: actions/checkout@v4
      - name: Compute image tag
        id: meta
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Set up buildx (zot insecure)
        run: |
          cat > /tmp/buildkitd.toml <<'EOF'
          [registry."192.168.10.131:5000"]
            insecure = true
          # Pull base images (node/golang/nginx) through the cluster Zot registry's
          # Docker Hub pull-through cache — never hit docker.io anonymously (429s).
          # :443, not :5000. Only the read-only group on :443 fronts the
          # docker.io proxy; :5000 is the hosted repository and 404s on
          # anything it was not pushed. It needs its own insecure entry too,
          # or the mirror fails TLS and BuildKit silently falls back to
          # Docker Hub — no error, and no benefit.
          [registry."192.168.10.131"]
            insecure = true
          [registry."docker.io"]
            mirrors = ["192.168.10.131"]
          EOF
          docker buildx create --name nm --driver docker-container \
            --platform linux/arm64,linux/amd64 --buildkitd-config /tmp/buildkitd.toml --use
          docker buildx inspect --bootstrap
      # Nexus requires credentials to push. The Zot registry this replaced
      # accepted anonymous writes, so no login was ever needed here — the
      # push now fails with "unauthorized: access to the requested resource
      # is not authorized" without it. Pulls stay anonymous.
      - name: Log in to Nexus
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.NEXUS_USER }}
          password: ${{ secrets.NEXUS_PASSWORD }}
      - name: Build & push admin-api (multi-arch → zot)
        uses: docker/build-push-action@v7
        with:
          context: services/admin-api
          builder: nm
          platforms: linux/arm64,linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/admin-api:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_BASE }}/admin-api:main
          cache-from: type=registry,ref=${{ env.REGISTRY }}/buildcache/novamail-admin-api:arm64
          cache-to: type=registry,ref=${{ env.REGISTRY }}/buildcache/novamail-admin-api:arm64,mode=max,image-manifest=true

  build-web:
    runs-on: arc-azrtydxb-publish
    steps:
      - uses: actions/checkout@v4
      - name: Compute image tag
        id: meta
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Set up buildx (zot insecure)
        run: |
          cat > /tmp/buildkitd.toml <<'EOF'
          [registry."192.168.10.131:5000"]
            insecure = true
          # Pull base images (node/golang/nginx) through the cluster Zot registry's
          # Docker Hub pull-through cache — never hit docker.io anonymously (429s).
          # :443, not :5000. Only the read-only group on :443 fronts the
          # docker.io proxy; :5000 is the hosted repository and 404s on
          # anything it was not pushed. It needs its own insecure entry too,
          # or the mirror fails TLS and BuildKit silently falls back to
          # Docker Hub — no error, and no benefit.
          [registry."192.168.10.131"]
            insecure = true
          [registry."docker.io"]
            mirrors = ["192.168.10.131"]
          EOF
          docker buildx create --name nm --driver docker-container \
            --platform linux/arm64,linux/amd64 --buildkitd-config /tmp/buildkitd.toml --use
          docker buildx inspect --bootstrap
      # Nexus requires credentials to push. The Zot registry this replaced
      # accepted anonymous writes, so no login was ever needed here — the
      # push now fails with "unauthorized: access to the requested resource
      # is not authorized" without it. Pulls stay anonymous.
      - name: Log in to Nexus
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.NEXUS_USER }}
          password: ${{ secrets.NEXUS_PASSWORD }}
      - name: Build & push web (multi-arch → zot)
        uses: docker/build-push-action@v7
        with:
          context: web
          builder: nm
          platforms: linux/arm64,linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/web:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_BASE }}/web:main
          cache-from: type=registry,ref=${{ env.REGISTRY }}/buildcache/novamail-web:arm64
          cache-to: type=registry,ref=${{ env.REGISTRY }}/buildcache/novamail-web:arm64,mode=max,image-manifest=true

  deploy:
    needs: [build-image, build-admin-api, build-web]
    # No `container:` — run on the runner pod itself so the in-cluster
    # ServiceAccount token (mounted at the standard path) is available.
    runs-on: arc-azrtydxb
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.31.0
      - name: Build kubeconfig from in-cluster SA token
        run: |
          SA=/var/run/secrets/kubernetes.io/serviceaccount
          kubectl config set-cluster kw \
            --server=https://kubernetes.default.svc \
            --certificate-authority=$SA/ca.crt --embed-certs=true
          kubectl config set-credentials runner --token="$(cat $SA/token)"
          kubectl config set-context kw --cluster=kw --user=runner --namespace=novamail
          kubectl config use-context kw
      - name: Helm upgrade --install
        # Store release state in ConfigMaps (not Secrets) so the deployer SA can
        # be least-privileged on Secrets (read-only) — a compromised runner can't
        # read app credentials/KEK. The first run with this driver adopts the
        # existing resources by release name (annotations already present).
        env:
          HELM_DRIVER: configmap
        run: |
          TAG="sha-${GITHUB_SHA::7}"
          helm upgrade --install novamail deploy/helm/novamail \
            --namespace novamail \
            --set image.tag="$TAG" \
            --wait --timeout 5m
      - name: Rollout status
        run: |
          kubectl -n novamail rollout status deploy/novamail-ingress --timeout=120s
          kubectl -n novamail rollout status deploy/novamail-delivery --timeout=120s
          kubectl -n novamail rollout status deploy/novamail-dsn --timeout=120s
          kubectl -n novamail rollout status deploy/novamail-admin-api --timeout=120s
          kubectl -n novamail rollout status deploy/novamail-web --timeout=120s
      - name: Post-deploy relay smoke (e2e)
        run: |
          chmod +x test/e2e/relay-smoke.sh
          set +e; NS=novamail test/e2e/relay-smoke.sh; code=$?; set -e
          if [ "$code" = "2" ]; then echo "::warning::relay smoke skipped (prereqs absent)"; exit 0; fi
          exit $code
