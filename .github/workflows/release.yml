name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  GHCR_IMAGE: ghcr.io/azrtydxb/novamail/ingress
  # Authoritative Kuvryn Ant (OKE), GitHub OIDC login; kw replicates oci-hosted.
  ANT_REGISTRY: ant.azrty.com/oci-hosted

jobs:
  # One build per architecture on a runner of that architecture (arc-azrtydxb = arm64,
  # arc-azrtydxb-amd64 = amd64) with the runner pod's BuildKit sidecar, pushed by digest
  # to ghcr and Kuvryn Ant; the image job below joins the digests under the tags.
  image-build:
    runs-on: ${{ matrix.arch == 'amd64' && 'arc-azrtydxb-amd64' || 'arc-azrtydxb' }}
    strategy:
      matrix:
        arch: [arm64, amd64]
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Kuvryn Ant (GitHub OIDC)
        uses: azrtydxb/ant-setup-action@7c6f1b8ca34a0a127b43040f4e16bbafdbd83791 # v1
        with:
          docker-login: "true"
          required: "true"
          go: "false"
          cargo: "false"
          pip: "false"
      - name: Set up buildx (runner pod's BuildKit sidecar)
        id: builder
        uses: azrtydxb/.github/actions/setup-builder@a6fb8e66bd50b411a1f20b826567ef320aec469b # main
      - name: Build & push linux/${{ matrix.arch }} → ghcr + Kuvryn Ant (by digest)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          builder: ${{ steps.builder.outputs.name }}
          platforms: linux/${{ matrix.arch }}
          build-args: SERVICE=ingress
          outputs: type=image,"name=${{ env.GHCR_IMAGE }},${{ env.ANT_REGISTRY }}/azrtydxb/novamail/ingress",push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  image:
    needs: [image-build]
    runs-on: arc-azrtydxb
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Version
        id: v
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Kuvryn Ant (GitHub OIDC)
        uses: azrtydxb/ant-setup-action@7c6f1b8ca34a0a127b43040f4e16bbafdbd83791 # v1
        with:
          docker-login: "true"
          required: "true"
          go: "false"
          cargo: "false"
          pip: "false"
      - name: Create & push multi-arch manifest lists → ghcr + Kuvryn Ant
        working-directory: ${{ runner.temp }}/digests
        env:
          VERSION: ${{ steps.v.outputs.version }}
          ANT_IMAGE: ${{ env.ANT_REGISTRY }}/azrtydxb/novamail/ingress
        run: |
          ghcr=(); ant=()
          for d in *; do
            ghcr+=("$GHCR_IMAGE@sha256:$d")
            ant+=("$ANT_IMAGE@sha256:$d")
          done
          docker buildx imagetools create -t "$GHCR_IMAGE:$VERSION" -t "$GHCR_IMAGE:latest" "${ghcr[@]}"
          docker buildx imagetools create -t "$ANT_IMAGE:$VERSION" "${ant[@]}"

  helm-publish:
    needs: [image]
    runs-on: arc-azrtydxb
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Version
        id: v
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
      - name: Package & push chart (OCI → ghcr)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" --password-stdin
          helm package deploy/helm/novamail \
            --version "${{ steps.v.outputs.version }}" \
            --app-version "${{ steps.v.outputs.version }}"
          helm push novamail-${{ steps.v.outputs.version }}.tgz \
            oci://ghcr.io/azrtydxb/charts

  github-release:
    needs: [image, helm-publish]
    runs-on: arc-azrtydxb
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
