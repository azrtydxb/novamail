name: PR Checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: arc-azrtydxb
    container:
      image: golang:1.25
    steps:
      - uses: actions/checkout@v4
      - run: go vet ./...
      - run: go test -race ./...

  lint:
    runs-on: arc-azrtydxb
    container:
      image: golangci/golangci-lint:v2.10.1
    steps:
      - uses: actions/checkout@v4
      - run: golangci-lint run ./...

  helm-lint:
    runs-on: arc-azrtydxb
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - run: helm lint deploy/helm/novamail

  node-check:
    runs-on: arc-azrtydxb
    container:
      image: node:24
    steps:
      - uses: actions/checkout@v4
      - working-directory: services/admin-api
        run: |
          npm ci
          npm run build
          npm test
      - working-directory: web
        run: |
          npm ci
          npm run build

  all-checks-passed:
    needs: [test, lint, helm-lint, node-check]
    if: always()
    runs-on: arc-azrtydxb
    steps:
      - name: Verify
        run: |
          [ "${{ needs.test.result }}" = "success" ] &&
          [ "${{ needs.lint.result }}" = "success" ] &&
          [ "${{ needs.helm-lint.result }}" = "success" ] &&
          [ "${{ needs.node-check.result }}" = "success" ] || exit 1
