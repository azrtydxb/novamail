name: PR Checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    tags: ["v*"]
  # Three-tier test model (azrtydxb/.github docs/ci-standard.md §Test tiers).
  # PR = fast unit/static tier: `go test -race` is folded into this workflow's
  # test job but only runs off the PR path (see the `test` job below).
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch: {}

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: arc-azrtydxb
    permissions:
      contents: read
      id-token: write # Kuvryn Ant OIDC (azrtydxb/ant-setup-action)
    container:
      image: golang:1.25
    steps:
      - uses: actions/checkout@v4
      - uses: azrtydxb/ant-setup-action@7c6f1b8ca34a0a127b43040f4e16bbafdbd83791 # v1
      - run: go vet ./...
      # PR path: hermetic unit tests only (target < 5 min).
      - name: Unit tests
        run: go test ./...
      # `race` is a full-tier signal (docs/ci-standard.md §Test tiers): it runs
      # on the nightly schedule, on a `v*` tag, and on manual dispatch, never
      # on a pull_request.
      - name: Unit tests (race)
        if: ${{ github.event_name != 'pull_request' }}
        run: go test -race ./...

  lint:
    runs-on: arc-azrtydxb
    permissions:
      contents: read
      id-token: write # Kuvryn Ant OIDC (azrtydxb/ant-setup-action)
    container:
      image: golangci/golangci-lint:v2.10.1
    steps:
      - uses: actions/checkout@v4
      - uses: azrtydxb/ant-setup-action@7c6f1b8ca34a0a127b43040f4e16bbafdbd83791 # v1
      - run: golangci-lint run ./...

  helm-lint:
    runs-on: arc-azrtydxb
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - run: helm lint deploy/helm/novamail

  node-check:
    runs-on: arc-azrtydxb
    permissions:
      contents: read
      id-token: write # Kuvryn Ant OIDC (azrtydxb/ant-setup-action)
    container:
      image: node:24
    steps:
      - uses: actions/checkout@v4
      - uses: azrtydxb/ant-setup-action@7c6f1b8ca34a0a127b43040f4e16bbafdbd83791 # v1
      - working-directory: services/admin-api
        run: |
          npm ci
          npm run build
          npm test
      - working-directory: web
        run: |
          npm ci
          npm run build

  all-checks-passed:
    needs: [test, lint, helm-lint, node-check]
    if: always()
    runs-on: arc-azrtydxb
    steps:
      - name: Verify
        run: |
          [ "${{ needs.test.result }}" = "success" ] &&
          [ "${{ needs.lint.result }}" = "success" ] &&
          [ "${{ needs.helm-lint.result }}" = "success" ] &&
          [ "${{ needs.node-check.result }}" = "success" ] || exit 1
