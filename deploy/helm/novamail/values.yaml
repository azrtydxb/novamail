# Default values for novamail (M1: ingress + delivery). Deploys to kw.

nameOverride: ""
fullnameOverride: "novamail"

image:
  # Pulled via the ghcr.io name: node containerd mirrors ghcr.io -> the Zot
  # registry at 192.168.10.123 (cluster-CA TLS), which serves the repo path CI
  # pushes. No imagePullSecret needed.
  registry: ghcr.io/azrtydxb/novamail
  # tag is the shared git sha for both images; the deploy pipeline overrides it.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Secrets created out-of-band (deploy/cluster/deps); both services read DSN +
# AMQP_URL from them via envFrom.
secrets:
  postgres: novamail-postgres
  rabbitmq: novamail-rabbitmq

# Master key (KEK) for envelope-encrypting provider creds + DKIM keys at rest.
# Secret key: NOVAMAIL_SECRET_KEY (base64 of 32 random bytes). Mounted into the
# admin-api (encrypt) and delivery (decrypt).
secretKeySecret: novamail-secret-key

ingressApp:
  replicas: 2
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }
  env:
    NOVAMAIL_HTTP_ADDR: ":8080"
    NOVAMAIL_SMTP_ADDR: ":2525"        # plaintext (no AUTH); in-cluster only
    NOVAMAIL_SUBMISSION_ADDR: ":2587"  # STARTTLS submission, exposed as 587
    NOVAMAIL_IMPLICIT_ADDR: ":2465"    # implicit TLS, exposed as 465
    NOVAMAIL_BODY_STORE: "postgres"

# Server TLS for the SMTP listeners. cert-manager issues the cert from the
# cluster-ca issuer; AUTH is only offered once the connection is TLS.
tls:
  enabled: true
  issuer: cluster-ca
  secretName: novamail-smtp-tls
  mountPath: /etc/novamail/tls
  dnsNames:
    - novamail-ingress
    - novamail-ingress.novamail.svc
    - novamail-ingress.novamail.svc.cluster.local
    - smtp.kw.local

dsn:
  replicas: 2
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { cpu: 250m, memory: 128Mi }
  env:
    NOVAMAIL_HTTP_ADDR: ":8080"
    NOVAMAIL_BODY_STORE: "postgres"

# Management plane: Fastify Admin API (CRUD over the config tables + config.changed).
adminApi:
  enabled: true
  replicas: 2
  port: 3000
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }
  # API key for the GUI/clients; lives in this Secret (key: NOVAMAIL_ADMIN_API_KEY).
  apiKeySecret: novamail-admin-api
  # Public origin the browser uses to reach /api (the web GUI host) — better-auth
  # uses this for the session-cookie domain, Secure flag, and CSRF origin check.
  publicURL: https://novamail.kw.local
  ingress:
    enabled: true
    host: admin.kw.local

# Management plane GUI (React+Vite served by non-root nginx, which proxies /api
# to the admin-api and injects the API key server-side).
web:
  enabled: true
  replicas: 2
  port: 8080
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { cpu: 250m, memory: 128Mi }
  ingress:
    enabled: true
    host: novamail.kw.local

delivery:
  replicas: 2
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }
  env:
    NOVAMAIL_HTTP_ADDR: ":8080"
    NOVAMAIL_BODY_STORE: "postgres"
    NOVAMAIL_PROVIDER_SECRETS: "/etc/novamail/provider-secrets"
  # Providers + routing live in Postgres (single source of truth). Provider
  # credentials are resolved by secret_ref from this optional Secret, mounted
  # read-only; keys are the secret_ref values, each a JSON {username,password,
  # clientId,clientSecret,refreshToken}.
  providerSecrets:
    enabled: false
    secretName: novamail-provider-creds
    mountPath: /etc/novamail/provider-secrets
  # Outbound DKIM signing. Key lives in an out-of-band Secret mounted read-only.
  dkim:
    enabled: true
    domain: example.com
    selector: s1
    secretName: novamail-dkim
    mountPath: /etc/novamail/dkim
    keyFile: key.pem

# Shared body store — ReadWriteMany so ingress and delivery pods share it.
bodyStore:
  # Message bodies are stored in Postgres (bytea) by default — no shared
  # filesystem needed. Set enabled=true (and NOVAMAIL_BODY_STORE to mountPath on
  # each service) only if you prefer a filesystem RWX volume instead.
  enabled: false
  storageClassName: longhorn
  accessMode: ReadWriteMany
  size: 10Gi
  mountPath: /var/lib/novamail/bodies

service:
  httpPort: 8080
  smtpPort: 2525

ingress:
  enabled: true
  className: nginx
  host: ingress.kw.local
  annotations:
    cert-manager.io/cluster-issuer: cluster-ca
  tls: true

smtpLoadBalancer:
  enabled: false
  externalTrafficPolicy: Cluster

serviceMonitor:
  enabled: true
  interval: 30s

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# Retention sweep: prunes terminal messages/events past settings.retention_days
# and removes orphaned body files. Runs daily as a CronJob.
maintenance:
  enabled: true
  schedule: "17 3 * * *"
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { cpu: 200m, memory: 128Mi }
