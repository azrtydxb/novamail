apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "novamail.fullname" . }}-dsn
  labels:
    {{- include "novamail.labels" . | nindent 4 }}
    app.kubernetes.io/component: dsn
spec:
  replicas: {{ .Values.dsn.replicas }}
  selector:
    matchLabels:
      {{- include "novamail.dsn.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "novamail.dsn.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: dsn
          image: {{ include "novamail.dsnImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            {{- include "novamail.depsEnvFrom" . | nindent 12 }}
          env:
            {{- range $k, $v := .Values.dsn.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.dsn.resources | nindent 12 }}
          volumeMounts:
            - name: bodies
              mountPath: {{ .Values.bodyStore.mountPath }}
      volumes:
        - name: bodies
          {{- if .Values.bodyStore.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "novamail.fullname" . }}-bodies
          {{- else }}
          emptyDir: {}
          {{- end }}
