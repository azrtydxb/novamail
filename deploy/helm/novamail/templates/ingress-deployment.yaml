apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "novamail.fullname" . }}-ingress
  labels:
    {{- include "novamail.labels" . | nindent 4 }}
    app.kubernetes.io/component: ingress
spec:
  replicas: {{ .Values.ingressApp.replicas }}
  selector:
    matchLabels:
      {{- include "novamail.ingress.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "novamail.ingress.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # Spread replicas across nodes so a single node loss can't take out a tier.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "novamail.ingress.selectorLabels" . | nindent 20 }}
      containers:
        - name: ingress
          image: {{ include "novamail.ingressImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
            - name: smtp
              containerPort: 2525
            {{- if .Values.tls.enabled }}
            - name: submission
              containerPort: 2587
            - name: smtps
              containerPort: 2465
            {{- end }}
          envFrom:
            {{- include "novamail.depsEnvFrom" . | nindent 12 }}
          env:
            {{- range $k, $v := .Values.ingressApp.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- if .Values.tls.enabled }}
            - name: NOVAMAIL_TLS_CERT
              value: {{ printf "%s/tls.crt" .Values.tls.mountPath | quote }}
            - name: NOVAMAIL_TLS_KEY
              value: {{ printf "%s/tls.key" .Values.tls.mountPath | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.ingressApp.resources | nindent 12 }}
          volumeMounts:
            {{- include "novamail.pgtls.volumeMount" . | nindent 12 }}
            {{- include "novamail.amqptls.volumeMount" . | nindent 12 }}
            - name: bodies
              mountPath: {{ .Values.bodyStore.mountPath }}
            {{- if .Values.tls.enabled }}
            - name: tls
              mountPath: {{ .Values.tls.mountPath }}
              readOnly: true
            {{- end }}
      volumes:
        {{- include "novamail.pgtls.volume" . | nindent 8 }}
        {{- include "novamail.amqptls.volume" . | nindent 8 }}
        - name: bodies
          {{- if .Values.bodyStore.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "novamail.fullname" . }}-bodies
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if .Values.tls.enabled }}
        - name: tls
          secret:
            secretName: {{ .Values.tls.secretName }}
        {{- end }}
