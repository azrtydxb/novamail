{{- if .Values.adminApi.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "novamail.fullname" . }}-admin-api
  labels:
    {{- include "novamail.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin-api
spec:
  replicas: {{ .Values.adminApi.replicas }}
  selector:
    matchLabels:
      {{- include "novamail.admin.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "novamail.admin.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000   # the node image's "node" user (numeric, so kubelet can verify)
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "novamail.admin.selectorLabels" . | nindent 20 }}
      containers:
        - name: admin-api
          image: {{ include "novamail.adminImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: {{ .Values.adminApi.port }}
          env:
            - name: PORT
              value: {{ .Values.adminApi.port | quote }}
            - name: NOVAMAIL_ADMIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.adminApi.apiKeySecret }}
                  key: NOVAMAIL_ADMIN_API_KEY
                  optional: true
            - name: NOVAMAIL_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretKeySecret }}
                  key: NOVAMAIL_SECRET_KEY
                  optional: true
            # better-auth: public origin (drives cookie Secure flag + CSRF origin)
            - name: BETTER_AUTH_URL
              value: {{ .Values.adminApi.publicURL | quote }}
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.adminApi.apiKeySecret }}
                  key: NOVAMAIL_ADMIN_API_KEY
                  optional: true
          envFrom:
            {{- include "novamail.depsEnvFrom" . | nindent 12 }}
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.adminApi.resources | nindent 12 }}
          {{- if .Values.pgmtls.enabled }}
          volumeMounts:
            {{- include "novamail.pgtls.volumeMount" . | nindent 12 }}
          {{- end }}
      {{- if .Values.pgmtls.enabled }}
      volumes:
        {{- include "novamail.pgtls.volume" . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "novamail.fullname" . }}-admin-api
  labels:
    {{- include "novamail.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin-api
spec:
  type: ClusterIP
  selector:
    {{- include "novamail.admin.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.adminApi.port }}
      targetPort: http
{{- if .Values.adminApi.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "novamail.fullname" . }}-admin-api
  labels:
    {{- include "novamail.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.tls.issuer }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts: [{{ .Values.adminApi.ingress.host | quote }}]
      secretName: {{ include "novamail.fullname" . }}-admin-tls
  rules:
    - host: {{ .Values.adminApi.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "novamail.fullname" . }}-admin-api
                port:
                  name: http
{{- end }}
{{- end }}
