{{- if .Values.delivery.keda.enabled }}
{{/*
KEDA queue-depth autoscaling for the delivery workers. delivery is I/O-bound on
the upstream SMTP handoff, so the relay.work backlog (not CPU) is the right
scaling signal. Requires KEDA installed cluster-wide.

Reads the queue length via RabbitMQ's HTTP management API. The bus is mutual-TLS
only, and KEDA's AMQP scaler doesn't load a custom CA cleanly, so we use the
management endpoint with unsafeSsl (TLS-encrypted; the self-signed cert is not
verified — acceptable for an in-cluster, read-only queue-length probe). The
management URL (with the operator's generated credentials) lives in the
novamail-rabbitmq-keda secret — create it with deps/gen-keda-secret.sh.
*/}}
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: {{ include "novamail.fullname" . }}-rabbitmq
  labels:
    {{- include "novamail.labels" . | nindent 4 }}
spec:
  secretTargetRef:
    - parameter: host
      name: {{ .Values.delivery.keda.hostSecret | default "novamail-rabbitmq-keda" }}
      key: host
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "novamail.fullname" . }}-delivery
  labels:
    {{- include "novamail.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    name: {{ include "novamail.fullname" . }}-delivery
  minReplicaCount: {{ .Values.delivery.keda.minReplicas }}
  maxReplicaCount: {{ .Values.delivery.keda.maxReplicas }}
  pollingInterval: {{ .Values.delivery.keda.pollingInterval | default 15 }}
  cooldownPeriod: {{ .Values.delivery.keda.cooldownPeriod | default 300 }}
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
  triggers:
    - type: rabbitmq
      metadata:
        protocol: http
        queueName: {{ .Values.delivery.keda.queueName | quote }}
        mode: QueueLength
        value: {{ .Values.delivery.keda.messagesPerReplica | quote }}
        vhostName: "/"
        unsafeSsl: "true"
      authenticationRef:
        name: {{ include "novamail.fullname" . }}-rabbitmq
{{- end }}
