{{- if .Values.tls.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "novamail.fullname" . }}-smtp
  labels:
    {{- include "novamail.labels" . | nindent 4 }}
spec:
  secretName: {{ .Values.tls.secretName }}
  issuerRef:
    kind: ClusterIssuer
    name: {{ .Values.tls.issuer }}
  dnsNames:
    {{- toYaml .Values.tls.dnsNames | nindent 4 }}
{{- end }}
