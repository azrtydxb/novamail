# One-time cluster bootstrap so the ARC runner can `helm upgrade --install` into
# the novamail namespace using its in-cluster ServiceAccount token (no kubeconfig
# secret needed). Apply once with: kubectl apply -f deploy/cluster/bootstrap-rbac.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: novamail
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: novamail-deployer
  namespace: novamail
rules:
  - apiGroups: [""]
    resources: [services, persistentvolumeclaims, configmaps, serviceaccounts, pods, events, endpoints]
    verbs: ["*"]
  # Least privilege: Helm release state now lives in ConfigMaps
  # (HELM_DRIVER=configmap), so the deployer only needs to READ Secrets (the e2e
  # smoke reads the PG password). A compromised runner can't exfiltrate/rotate
  # app credentials or the KEK. NOTE: apply this only AFTER the first
  # configmap-driver deploy succeeds, else an in-flight secrets-driver deploy
  # can't write its release Secret.
  - apiGroups: [""]
    resources: [secrets]
    verbs: ["get", "list", "watch"]
  # pods/exec + pods/log: the post-deploy relay smoke (test/e2e) submits from an
  # ephemeral pod and verifies the message status via psql exec.
  - apiGroups: [""]
    resources: [pods/exec, pods/log]
    verbs: ["create", "get"]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets]
    verbs: ["*"]
  # Autoscaling: HPAs for the data plane + management services.
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: ["*"]
  # KEDA: queue-depth ScaledObject + TriggerAuthentication for delivery.
  - apiGroups: [keda.sh]
    resources: [scaledobjects, triggerauthentications]
    verbs: ["*"]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: ["*"]
  - apiGroups: [monitoring.coreos.com]
    resources: [servicemonitors]
    verbs: ["*"]
  - apiGroups: [cert-manager.io]
    resources: [certificates]
    verbs: ["*"]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: ["*"]
  - apiGroups: [batch]
    resources: [cronjobs, jobs]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: novamail-deployer
  namespace: novamail
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: novamail-deployer
subjects:
  # Both ARC scale-set runner ServiceAccounts (they ship with zero permissions).
  - kind: ServiceAccount
    name: arc-azrtydxb-gha-rs-no-permission
    namespace: arc-runners
  - kind: ServiceAccount
    name: arc-azrtydxb-publish-gha-rs-no-permission
    namespace: arc-runners
