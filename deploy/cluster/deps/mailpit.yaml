# Mailpit — a test SMTP sink + web UI used as the generic-smarthost upstream
# for M1 end-to-end verification. NOT a production component.
# SMTP on 1025, web UI on 8025.
apiVersion: v1
kind: Service
metadata:
  name: novamail-mailpit
  namespace: novamail
  labels: { app.kubernetes.io/name: novamail-mailpit }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: novamail-mailpit }
  ports:
    - name: smtp
      port: 1025
      targetPort: 1025
    - name: http
      port: 8025
      targetPort: 8025
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: novamail-mailpit
  namespace: novamail
  labels: { app.kubernetes.io/name: novamail-mailpit }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: novamail-mailpit }
  template:
    metadata:
      labels: { app.kubernetes.io/name: novamail-mailpit }
    spec:
      containers:
        - name: mailpit
          image: axllent/mailpit:v1.21
          ports:
            - { name: smtp, containerPort: 1025 }
            - { name: http, containerPort: 8025 }
          readinessProbe:
            tcpSocket: { port: 1025 }
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 250m, memory: 128Mi }
