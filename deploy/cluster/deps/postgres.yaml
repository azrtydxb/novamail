# Single-instance Postgres for novamail (M0.5). Longhorn-backed.
# Credentials come from the `novamail-postgres` Secret (created out-of-band,
# never committed). HA Postgres is a later milestone.
apiVersion: v1
kind: Service
metadata:
  name: novamail-postgres
  namespace: novamail
  labels: { app.kubernetes.io/name: novamail-postgres }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: novamail-postgres }
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: novamail-postgres
  namespace: novamail
  labels: { app.kubernetes.io/name: novamail-postgres }
spec:
  serviceName: novamail-postgres
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: novamail-postgres }
  template:
    metadata:
      labels: { app.kubernetes.io/name: novamail-postgres }
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:16
          envFrom:
            - secretRef: { name: novamail-postgres }
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "novamail", "-d", "novamail"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "novamail", "-d", "novamail"]
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: longhorn
        resources:
          requests:
            storage: 10Gi
